<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр A1 — немецкие карточки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    padding: 20px;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    color: #fff;
    font-size: 1.6rem;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    color: #b0d4e0;
    font-size: 0.85rem;
    margin-bottom: 20px;
    text-align: center;
  }

  /* Верхняя панель со статистикой */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    width: 100%;
    max-width: 700px;
  }

  .stat-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 10px 16px;
    color: #fff;
    text-align: center;
    min-width: 90px;
    flex: 1;
  }

  .stat-box .num {
    font-size: 1.5rem;
    font-weight: 800;
    display: block;
    line-height: 1.1;
  }

  .stat-box .lbl {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #b0d4e0;
    margin-top: 4px;
  }

  .stat-box.good .num { color: #4caf50; }
  .stat-box.bad .num { color: #ff5252; }
  .stat-box.total .num { color: #ffd166; }

  /* Прогресс-бар */
  .progress {
    width: 100%;
    max-width: 700px;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 25px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, #ffd166);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Карточка */
  .card-wrap {
    perspective: 1200px;
    width: 100%;
    max-width: 500px;
    height: 340px;
    margin-bottom: 22px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.7s;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 18px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    overflow-y: auto;
  }

  .front {
    background: #fff;
    border-top: 6px solid #ffd166;
    text-align: center;
  }

  .front .category {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #d97706;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .front .word {
    font-size: 1.75rem;
    font-weight: 800;
    color: #1e3c72;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .front .pron {
    font-size: 1.05rem;
    color: #d97706;
    font-style: italic;
    margin-bottom: 10px;
  }

  .front .extra {
    font-size: 0.9rem;
    color: #666;
    margin-top: 8px;
  }

  .front .hint {
    font-size: 0.72rem;
    color: #bbb;
    margin-top: 18px;
  }

  .back {
    background: linear-gradient(160deg, #1e3c72, #2a5298);
    color: #fff;
    transform: rotateY(180deg);
    text-align: center;
  }

  .back .translation {
    font-size: 1.55rem;
    font-weight: 800;
    color: #ffd166;
    margin-bottom: 16px;
  }

  .back .example {
    font-size: 0.95rem;
    line-height: 1.55;
    margin-bottom: 10px;
  }

  .back .example .de { font-weight: 600; color: #fff; }
  .back .example .ru { color: #b0d4e0; font-size: 0.88rem; }

  /* Кнопки */
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 500px;
  }

  .btn {
    padding: 14px 26px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
    flex: 1;
    min-width: 130px;
  }

  .btn:active { transform: scale(0.97); }

  .btn-show {
    background: #ffd166;
    color: #7a2006;
    box-shadow: 0 4px 12px rgba(255,209,102,0.4);
  }

  .btn-good {
    background: #4caf50;
    color: #fff;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
  }

  .btn-bad {
    background: #ff5252;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,82,82,0.4);
  }

  .btn-reset {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    flex: 0 0 auto;
    min-width: 0;
    padding: 10px 18px;
    font-size: 0.85rem;
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
  }

  /* Экран завершения */
  .finish {
    display: none;
    max-width: 500px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 18px;
    padding: 35px 30px;
    text-align: center;
    color: #fff;
  }

  .finish h2 {
    font-size: 1.6rem;
    margin-bottom: 14px;
    color: #ffd166;
  }

  .finish p {
    font-size: 1.05rem;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .finish .score-big {
    font-size: 2.6rem;
    font-weight: 800;
    color: #4caf50;
    display: block;
    margin: 10px 0;
  }

  .finish .btn {
    display: inline-block;
    margin: 5px;
    flex: 0 0 auto;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.25rem; }
    .card-wrap { height: 380px; }
    .front .word { font-size: 1.4rem; }
    .back .translation { font-size: 1.3rem; }
    .stat-box { padding: 8px 10px; min-width: 70px; }
    .stat-box .num { font-size: 1.2rem; }
    .btn { padding: 12px 16px; font-size: 0.92rem; min-width: 0; }
  }
</style>
</head>
<body>

<h1>🎯 Тренажёр немецких карточек A1</h1>
<p class="subtitle">Случайный порядок · Отмечай «Знаю» / «Не знаю»</p>

<!-- Статистика -->
<div class="stats">
  <div class="stat-box total">
    <span class="num" id="statTotal">0</span>
    <div class="lbl">Всего</div>
  </div>
  <div class="stat-box good">
    <span class="num" id="statGood">0</span>
    <div class="lbl">Знаю</div>
  </div>
  <div class="stat-box bad">
    <span class="num" id="statBad">0</span>
    <div class="lbl">Не знаю</div>
  </div>
  <div class="stat-box">
    <span class="num" id="statLeft">0</span>
    <div class="lbl">Осталось</div>
  </div>
</div>

<div class="progress"><div class="progress-fill" id="progressFill"></div></div>

<!-- Карточка -->
<div id="trainerView">
  <div class="card-wrap">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-face front">
        <div class="category" id="cardCategory">—</div>
        <div class="word" id="cardWord">—</div>
        <div class="pron" id="cardPron"></div>
        <div class="extra" id="cardExtra"></div>
        <div class="hint">нажми, чтобы перевернуть 🔄</div>
      </div>
      <div class="card-face back">
        <div class="translation" id="cardTrans">—</div>
        <div class="example" id="cardExample"></div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-show" id="btnShow" onclick="flipCard()">Показать ответ</button>
    <button class="btn btn-good" id="btnGood" onclick="answer(true)" disabled>✓ Знаю</button>
    <button class="btn btn-bad" id="btnBad" onclick="answer(false)" disabled>✗ Не знаю</button>
    <button class="btn btn-reset" onclick="resetAll()">⟲ Сброс</button>
  </div>
</div>

<!-- Финал -->
<div class="finish" id="finishView">
  <h2>🎉 Тренировка завершена!</h2>
  <p>Твой результат:</p>
  <span class="score-big" id="finalScore">0%</span>
  <p id="finalText"></p>
  <button class="btn btn-good" onclick="resetAll()">Пройти заново</button>
  <button class="btn btn-bad" onclick="retryMistakes()">Повторить ошибки</button>
</div>

<script>
/* =====================================================
   БАЗА КАРТОЧЕК
   Формат: { c: категория, w: слово, p: произношение,
             e: доп. инфо (артикль/спряжение), t: перевод,
             ex: пример (DE), exr: пример (RU) }
   ===================================================== */

const CARDS = [
  /* --- ГЛАГОЛЫ (44) --- */
  {c:"Глаголы", w:"sein", p:"[зайн]", e:"ich bin, du bist, er ist...", t:"быть", ex:"Ich bin Student.", exr:"Я студент."},
  {c:"Глаголы", w:"haben", p:"[хабэн]", e:"ich habe, du hast, er hat...", t:"иметь", ex:"Ich habe einen Hund.", exr:"У меня есть собака."},
  {c:"Глаголы", w:"werden", p:"[вэрдэн]", e:"ich werde, du wirst...", t:"становиться", ex:"Ich werde Arzt.", exr:"Я становлюсь врачом."},
  {c:"Глаголы", w:"können", p:"[кёнэн]", e:"ich kann, du kannst...", t:"мочь / уметь", ex:"Ich kann Deutsch sprechen.", exr:"Я умею говорить по-немецки."},
  {c:"Глаголы", w:"müssen", p:"[мюсэн]", e:"ich muss, du musst...", t:"быть должным", ex:"Ich muss arbeiten.", exr:"Я должен работать."},
  {c:"Глаголы", w:"wollen", p:"[волен]", e:"ich will, du willst...", t:"хотеть", ex:"Ich will nach Hause.", exr:"Я хочу домой."},
  {c:"Глаголы", w:"sollen", p:"[золен]", e:"ich soll, du sollst...", t:"быть должным (по совету)", ex:"Du sollst mehr schlafen.", exr:"Тебе следует больше спать."},
  {c:"Глаголы", w:"dürfen", p:"[дюрфэн]", e:"ich darf, du darfst...", t:"иметь разрешение", ex:"Darf ich hereinkommen?", exr:"Можно войти?"},
  {c:"Глаголы", w:"mögen", p:"[мёгэн]", e:"ich mag, du magst...", t:"любить / нравиться", ex:"Ich mag Schokolade.", exr:"Я люблю шоколад."},
  {c:"Глаголы", w:"möchten", p:"[мёхьтэн]", e:"ich möchte, du möchtest...", t:"хотел бы", ex:"Ich möchte einen Kaffee.", exr:"Я хотел бы кофе."},
  {c:"Глаголы", w:"gehen", p:"[гэен]", e:"ich gehe, du gehst...", t:"идти / ходить", ex:"Ich gehe nach Hause.", exr:"Я иду домой."},
  {c:"Глаголы", w:"kommen", p:"[комэн]", e:"ich komme, du kommst...", t:"приходить", ex:"Ich komme aus Russland.", exr:"Я из России."},
  {c:"Глаголы", w:"machen", p:"[махэн]", e:"ich mache, du machst...", t:"делать", ex:"Was machst du?", exr:"Что ты делаешь?"},
  {c:"Глаголы", w:"sprechen", p:"[шпрэхэн]", e:"du sprichst, er spricht", t:"говорить", ex:"Ich spreche Deutsch.", exr:"Я говорю по-немецки."},
  {c:"Глаголы", w:"lesen", p:"[лезэн]", e:"du liest, er liest", t:"читать", ex:"Ich lese ein Buch.", exr:"Я читаю книгу."},
  {c:"Глаголы", w:"schreiben", p:"[шрайбэн]", e:"ich schreibe, du schreibst...", t:"писать", ex:"Ich schreibe einen Brief.", exr:"Я пишу письмо."},
  {c:"Глаголы", w:"essen", p:"[эсэн]", e:"du isst, er isst", t:"есть / кушать", ex:"Ich esse einen Apfel.", exr:"Я ем яблоко."},
  {c:"Глаголы", w:"trinken", p:"[тринкэн]", e:"ich trinke, du trinkst...", t:"пить", ex:"Ich trinke Kaffee.", exr:"Я пью кофе."},
  {c:"Глаголы", w:"schlafen", p:"[шлафэн]", e:"du schläfst, er schläft", t:"спать", ex:"Ich schlafe acht Stunden.", exr:"Я сплю восемь часов."},
  {c:"Глаголы", w:"arbeiten", p:"[арбайтэн]", e:"ich arbeite, du arbeitest...", t:"работать", ex:"Ich arbeite in Berlin.", exr:"Я работаю в Берлине."},
  {c:"Глаголы", w:"lernen", p:"[лернэн]", e:"ich lerne, du lernst...", t:"учить(ся)", ex:"Ich lerne Deutsch.", exr:"Я учу немецкий."},
  {c:"Глаголы", w:"verstehen", p:"[фэрштэен]", e:"ich verstehe, du verstehst...", t:"понимать", ex:"Ich verstehe dich.", exr:"Я тебя понимаю."},
  {c:"Глаголы", w:"fahren", p:"[фаарэн]", e:"du fährst, er fährt", t:"ехать", ex:"Ich fahre nach München.", exr:"Я еду в Мюнхен."},
  {c:"Глаголы", w:"kaufen", p:"[кауфэн]", e:"ich kaufe, du kaufst...", t:"покупать", ex:"Ich kaufe Brot.", exr:"Я покупаю хлеб."},
  {c:"Глаголы", w:"sehen", p:"[зэен]", e:"du siehst, er sieht", t:"видеть", ex:"Ich sehe einen Vogel.", exr:"Я вижу птицу."},
  {c:"Глаголы", w:"hören", p:"[хёэрэн]", e:"ich höre, du hörst...", t:"слышать / слушать", ex:"Ich höre Musik.", exr:"Я слушаю музыку."},
  {c:"Глаголы", w:"wohnen", p:"[воэнэн]", e:"ich wohne, du wohnst...", t:"жить (проживать)", ex:"Ich wohne in Moskau.", exr:"Я живу в Москве."},
  {c:"Глаголы", w:"spielen", p:"[шпилен]", e:"ich spiele, du spielst...", t:"играть", ex:"Ich spiele Fußball.", exr:"Я играю в футбол."},

  {c:"Глаголы", w:"nehmen", p:"[немэн]", e:"du nimmst, er nimmt", t:"брать", ex:"Ich nehme den Bus.", exr:"Я еду на автобусе."},
  {c:"Глаголы", w:"heißen", p:"[хайсэн]", e:"ich heiße, du heißt...", t:"зваться", ex:"Ich heiße Anna.", exr:"Меня зовут Анна."},
  {c:"Глаголы", w:"sagen", p:"[загэн]", e:"ich sage, du sagst...", t:"говорить / сказать", ex:"Was sagst du?", exr:"Что ты говоришь?"},
  {c:"Глаголы", w:"fragen", p:"[фрагэн]", e:"ich frage, du fragst...", t:"спрашивать", ex:"Ich frage den Lehrer.", exr:"Я спрашиваю учителя."},
  {c:"Глаголы", w:"antworten", p:"[антвортэн]", e:"ich antworte, du antwortest...", t:"отвечать", ex:"Ich antworte auf die Frage.", exr:"Я отвечаю на вопрос."},
  {c:"Глаголы", w:"brauchen", p:"[браухэн]", e:"ich brauche, du brauchst...", t:"нуждаться", ex:"Ich brauche Hilfe.", exr:"Мне нужна помощь."},
  {c:"Глаголы", w:"finden", p:"[финдэн]", e:"ich finde, du findest...", t:"находить; считать", ex:"Ich finde den Schlüssel.", exr:"Я нахожу ключ."},
  {c:"Глаголы", w:"suchen", p:"[зухэн]", e:"ich suche, du suchst...", t:"искать", ex:"Ich suche meine Brille.", exr:"Я ищу свои очки."},
  {c:"Глаголы", w:"helfen", p:"[хельфэн]", e:"du hilfst, er hilft", t:"помогать", ex:"Ich helfe meiner Mutter.", exr:"Я помогаю маме."},
  {c:"Глаголы", w:"bleiben", p:"[бляйбэн]", e:"ich bleibe, du bleibst...", t:"оставаться", ex:"Ich bleibe zu Hause.", exr:"Я остаюсь дома."},
  {c:"Глаголы", w:"aufstehen", p:"[ауфштэен]", e:"ich stehe auf, du stehst auf...", t:"вставать", ex:"Ich stehe um 7 Uhr auf.", exr:"Я встаю в 7 часов."},
  {c:"Глаголы", w:"einkaufen", p:"[айнкауфэн]", e:"ich kaufe ein, du kaufst ein...", t:"делать покупки", ex:"Ich kaufe im Supermarkt ein.", exr:"Я делаю покупки в супермаркете."},
  {c:"Глаголы", w:"anrufen", p:"[анруфэн]", e:"ich rufe an, du rufst an...", t:"звонить", ex:"Ich rufe dich morgen an.", exr:"Я позвоню тебе завтра."},
  {c:"Глаголы", w:"anfangen", p:"[анфангэн]", e:"du fängst an, er fängt an", t:"начинать", ex:"Der Film fängt um 8 an.", exr:"Фильм начинается в 8."},
  {c:"Глаголы", w:"aufhören", p:"[ауфхёэрэн]", e:"ich höre auf, du hörst auf...", t:"прекращать", ex:"Hör bitte auf!", exr:"Прекрати, пожалуйста!"},

  /* --- СЕМЬЯ / ПРОФЕССИИ (36) --- */

  {c:"Семья, люди, профессии", w:"die Eltern", p:"[эльтэрн]", e:"Plural", t:"родители", ex:"Meine Eltern wohnen in Berlin.", exr:"Мои родители живут в Берлине."},

  {c:"Семья, люди, профессии", w:"die Schwester", p:"[швэстэр]", e:"die Schwestern", t:"сестра", ex:"Meine Schwester ist Ärztin.", exr:"Моя сестра — врач."},
  {c:"Семья, люди, профессии", w:"die Geschwister", p:"[гэшвистэр]", e:"Plural", t:"братья и сёстры", ex:"Hast du Geschwister?", exr:"У тебя есть братья или сёстры?"},
  {c:"Семья, люди, профессии", w:"die Familie", p:"[фамилиэ]", e:"die Familien", t:"семья", ex:"Meine Familie ist groß.", exr:"Моя семья большая."},
  {c:"Семья, люди, профессии", w:"die Großmutter", p:"[гросмутэр]", e:"die Großmütter", t:"бабушка", ex:"Meine Großmutter ist 80.", exr:"Моей бабушке 80 лет."},
  {c:"Семья, люди, профессии", w:"der Großvater", p:"[гросфатэр]", e:"die Großväter", t:"дедушка", ex:"Mein Großvater liest gern.", exr:"Мой дедушка любит читать."},
  {c:"Семья, люди, профессии", w:"die Tochter", p:"[тохтэр]", e:"die Töchter", t:"дочь", ex:"Meine Tochter ist fünf.", exr:"Моей дочери пять лет."},

/* Перемешивание Фишера-Йетса */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  deck = shuffle(CARDS);
  currentIndex = 0;
  stats = { good: 0, bad: 0, total: deck.length };
  mistakes = [];
  finishView.style.display = 'none';
  trainerView.style.display = 'block';
  showCard();
  updateStats();
}

function showCard() {
  if (currentIndex >= deck.length) {
    finishTrainer();
    return;
  }
  const c = deck[currentIndex];
  elCategory.textContent = c.c || '';
  elWord.textContent = c.w || '';
  elPron.textContent = c.p || '';
  elExtra.textContent = c.e || '';
  elTrans.textContent = c.t || '';
  elExample.innerHTML = `<div class="de">${c.ex || ''}</div><div class="ru">${c.exr || ''}</div>`;

  card.classList.remove('flipped');
  isFlipped = false;
  btnGood.disabled = true;
  btnBad.disabled = true;
  btnShow.disabled = false;
  updateStats();
}

function flipCard() {
  if (!isFlipped) {
    card.classList.add('flipped');
    isFlipped = true;
    btnGood.disabled = false;
    btnBad.disabled = false;
    btnShow.disabled = true;
  }
}

function answer(known) {
  if (!isFlipped) return;
  const c = deck[currentIndex];
  if (known) {
    stats.good++;
  } else {
    stats.bad++;
    mistakes.push(c);
  }
  currentIndex++;
  showCard();
  updateStats();
}

function updateStats() {
  document.getElementById('statTotal').textContent = stats.total;
  document.getElementById('statGood').textContent = stats.good;
  document.getElementById('statBad').textContent = stats.bad;
  const left = stats.total - (stats.good + stats.bad);
  document.getElementById('statLeft').textContent = left;
  const done = stats.good + stats.bad;
  const pct = stats.total ? (done / stats.total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function finishTrainer() {
  trainerView.style.display = 'none';
  finishView.style.display = 'block';
  const done = stats.good + stats.bad;
  const pct = done ? Math.round((stats.good / done) * 100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  const txt = document.getElementById('finalText');
  if (pct >= 90) txt.textContent = 'Отличный результат! Ты почти готов(а) к A1. 🎉';
  else if (pct >= 70) txt.textContent = 'Хорошо! Повтори сложные карточки — и будет отлично. 👍';
  else if (pct >= 50) txt.textContent = 'Неплохо, но стоит ещё потренироваться. 💪';
  else txt.textContent = 'Не расстраивайся — нажми «Повторить ошибки» и закрепи материал. 📚';
}

function resetAll() {
  initTrainer();
}

function retryMistakes() {
  if (!mistakes.length) {
    alert('Ошибок нет — всё выучено! 🎉');
    return;
  }
  deck = shuffle(mistakes);
  currentIndex = 0;
  stats = { good: 0, bad: 0, total: deck.length };
  mistakes = [];
  finishView.style.display = 'none';
  trainerView.style.display = 'block';
  showCard();
  updateStats();
}

/* Обработка клавиатуры */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.code === 'ArrowRight' && isFlipped) { e.preventDefault(); answer(true); }
  if (e.code === 'ArrowLeft' && isFlipped) { e.preventDefault(); answer(false); }
});

/* Запуск */
initTrainer();
</script>
